# Render.com deployment blueprint (free web tier + external Neon Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Create a Neon project and copy the Postgres connection string
#   2. Push this repo to GitHub
#   3. New Blueprint on Render → connect repo → paste DATABASE_URL when prompted
#   4. ALLOWED_ORIGINS is set below for pemsports.com
#
# Data:
#   RANKINGS_STORE=postgres: FastAPI reads Neon stats.* at runtime.
#   DuckDB bake (bake_db.py + validate_db_completeness) stays in CI/local
#   and the Dockerfile image build — not on the Render web build, which is
#   512MB free and must reach gunicorn listen before the port-scan window.

services:
  - type: web
    name: nflstats-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u -m gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --log-level info backend.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set from Neon dashboard during Blueprint creation (sync: false).
      # Use the pooled connection string; include ?sslmode=require if not present.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RANKINGS_STORE
        value: postgres
      - key: ALLOWED_ORIGINS
        value: https://pemsports.com,https://www.pemsports.com
    healthCheckPath: /health
    autoDeploy: true
