# Render.com Managed Deployment Blueprint (Mode A)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── FastAPI Backend Engine ──────────────────────────────────────
  - type: web
    name: nflstats-api-alpha
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60 src.backend.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        value: 92c05dfefc6383ddd88dbf20c0d3e253804e1cd5aa79e94711c0bf16e40015
      - key: ALLOWED_ORIGINS
        # Wildcard allows initial frontend connection; lock this to Vercel later.
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nflstats-db-prod
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # ── Managed PostgreSQL ──────────────────────────────────────────
databases:
  - name: nflstats-db-prod
    plan: free
    databaseName: nflstats
    user: postgres
