# Render.com deployment blueprint (free web tier + external Neon Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Create a Neon project and copy the Postgres connection string
#   2. Push this repo to GitHub
#   3. New Blueprint on Render → connect repo → paste DATABASE_URL when prompted
#   4. ALLOWED_ORIGINS is set below for pemsports.com
#
# Data:
#   Ranking Parquet under data/rankings/ is committed. buildCommand runs
#   build_players_dimension.py (deterministic UUID player_id) then bake_db.py
#   to materialize data/nfl_stats.db before start.
#
# Auth Postgres lives on Neon (not Render). Rankings stay in baked DuckDB.

services:
  - type: web
    name: nflstats-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_players_dimension.py && python scripts/enrich_espn_player_ids.py && python scripts/bake_db.py && python scripts/validate_db_completeness.py --mode both
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60 backend.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: src
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set from Neon dashboard during Blueprint creation (sync: false).
      # Use the pooled connection string; include ?sslmode=require if not present.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://pemsports.com,https://www.pemsports.com
    healthCheckPath: /health
    autoDeploy: true
