# Render.com deployment blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. Create a new Blueprint on Render and point it at this file
#   3. ALLOWED_ORIGINS is set below for pemsports.com; edit if the domain changes
#
# Data:
#   Ranking Parquet under data/rankings/ is committed. buildCommand runs
#   build_players_dimension.py (deterministic UUID player_id) then bake_db.py
#   to materialize data/nfl_stats.db before start.

databases:
  - name: nflstats-db
    plan: starter

services:
  - type: web
    name: nflstats-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/build_players_dimension.py && python scripts/bake_db.py
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60 backend.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: src
      - key: APP_ENV
        value: production
      # 32+ char secret generated by Render; never reuse the dev default.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nflstats-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://pemsports.com,https://www.pemsports.com
    healthCheckPath: /health
    autoDeploy: true
