# Frontend CI/CD — React (Vite) → Vercel
#
# Triggers on changes to frontend source.
# Gate job: eslint + vite build (runs on every push/PR to main)
#
# Production deploy: Vercel Git integration (recommended). Connect the repo in the
# Vercel dashboard with Root Directory = frontend/nflstats-pro-ui (or use root
# vercel.json which builds the SPA from that path). Pushes to main auto-deploy.
#
# Optional GitHub Actions deploy (below, commented): set VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID if you prefer Actions-owned CD instead of Vercel native CD.

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/nflstats-pro-ui/**"
      - "vercel.json"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/nflstats-pro-ui/**"
      - "vercel.json"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nflstats-pro-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/nflstats-pro-ui/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Vite)
        env:
          # Placeholder baked into the bundle; Vercel sets the real value at deploy time.
          VITE_API_BASE: https://nflstats-api.onrender.com/api/v1
        run: npm run build

